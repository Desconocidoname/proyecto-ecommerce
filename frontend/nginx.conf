# Nginx del frontend: sirve la aplicación React y reenvía /api/ al backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Peticiones a la API: van al backend por la red interna de Docker
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # la predicción masiva puede tardar
    }

    # Archivos compilados (llevan un hash en el nombre): se guardan en caché
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cualquier otra ruta (/resumen, /cupon/VUELVE-7F3K2, ...) la resuelve React
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
