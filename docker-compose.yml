# Los 5 servicios del sistema. Cada servicio necesita su Dockerfile en su carpeta.
# Uso:  docker compose up --build
services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./data/raw:/data:ro
    ports:
      - "5432:5432"   # solo para desarrollo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [churn-net]

  ml-service:
    build: ./ml/serving
    env_file: .env
    volumes:
      - ./ml/models:/models:ro   # el modelo entrenado, solo lectura
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      start_period: 20s
      retries: 10
    networks: [churn-net]

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      start_period: 10s
      retries: 10
    networks: [churn-net]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "3000:80"
    networks: [churn-net]

  training:
    build: ./ml/training
    env_file: .env
    volumes:
      - ./ml/models:/models                       # aquí guarda los modelos
      - ./data/processed:/app/data/processed      # train.csv y test.csv
    depends_on:
      db:
        condition: service_healthy
    profiles: ["training"]   # no arranca con "up"; se ejecuta con "run"
    networks: [churn-net]

networks:
  churn-net:

volumes:
  pgdata:
